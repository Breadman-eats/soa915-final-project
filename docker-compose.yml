services:
  user-service:
    build: ./user-service
    ports:
      - "8000:8000"
    restart: unless-stopped

  order-service:
    build: ./order-service
    ports:
      - "8001:8001"
    restart: unless-stopped
    depends_on:
      - user-service

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped
    depends_on:
      - user-service
      - order-service

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: unless-stopped
    depends_on:
      - prometheus

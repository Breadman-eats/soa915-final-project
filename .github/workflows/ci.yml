name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-user-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ./user-service
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: ./user-service
        run: pytest

  test-order-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ./order-service
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: ./order-service
        run: pytest

  build-docker-images:
    runs-on: ubuntu-latest
    needs: [test-user-service, test-order-service]
    steps:
      - uses: actions/checkout@v4

      - name: Build User Service image
        run: docker build -t user-service ./user-service

      - name: Build Order Service image
        run: docker build -t order-service ./order-service
